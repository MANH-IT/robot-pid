[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; --- Cấu hình Serial Monitor ---
monitor_speed = 115200
monitor_filters = time, printable

; --- Build flags ---
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

; --- Upload speed ---
upload_speed = 115200

; --- Thư viện ---
lib_deps =
    bblanchon/ArduinoJson@^6.21.3