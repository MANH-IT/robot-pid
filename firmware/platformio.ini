[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -I include
monitor_speed = 115200
monitor_filters = time, printable

; Nạp dự phòng qua bootloader USART1 khi ST-Link không kết nối được.
; Phần cứng: BOOT0=1, BOOT1=0; USB-TTL 3.3V TX -> PA10, RX -> PA9, GND chung.
; CANH BAO: PA9/PA10 dùng chung với RPWM2/RPWM3 của BTS7960. Trước khi nạp
; phải ngắt 12 V động cơ và rút dây RPWM2/RPWM3 khỏi driver.
; Đổi upload_port cho đúng cổng COM của USB-TTL (Device Manager).
; Sau khi nạp: gạt BOOT0=0 rồi nhấn RESET.
[env:bluepill_serial]
extends = env:bluepill_f103c8
upload_protocol = serial
upload_speed = 115200
upload_port = COM7

; Nạp ST-Link kiểu "connect under reset": nối thêm ST-Link RST -> chân R của Blue Pill.
[env:bluepill_stlink_reset]
extends = env:bluepill_f103c8
upload_flags =
    -c "reset_config srst_only srst_nogate connect_assert_srst"
